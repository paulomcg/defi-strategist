schema_version: 1
name: defi-strategist
version: "0.3.0"
description: "Strategy + observability layer over OnChainOS DeFi primitives. v0.3 ships dynamic graph discovery (builds a token-edge graph from `defi detail` lpToken/underlyingToken fields — no hardcoded protocol map needed), risk scoring (APY volatility + TVL stability via `rate-chart` + `tvl-chart` history), N-step loop execution with receipt-balance polling between steps, and best-effort rollback on partial failure (walks back through completed legs emitting `defi redeem` calldata). Six CLI verbs: scan (cross-chain yield discovery), positions (wallet snapshot), discover (loop enumeration with optional --with-risk scoring), run-loop (execute discovered composition with --live / --dry-run-actions safety gates), watch (continuous monitor with declarative rules including auto_compound), audit (replay event log). Three-stage opt-in safety progression for write actions. Trigger phrases: find yield loops, discover DeFi strategies, composable yield, auto-compound, claim and reinvest, monitor DeFi positions, scan yields, risk score, weakest link, multi-step deposit, LST restake, Marinade Solayer, Jito Solayer, Lido Aave, yield rotation, rollback, defi audit."
author:
