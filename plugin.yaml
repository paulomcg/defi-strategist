name: defi-strategist
version: 0.2.0
description: >
  Strategy + observability layer over OnChainOS DeFi primitives.
  v0.2 adds COMPOSABLE LOOP DISCOVERY (`discover` enumerates 1- and
  2-step yield loops across protocols, e.g. SOL → Marinade → mSOL →
  Solayer restake) and on-demand loop execution (`run-loop` drives the
  full sequence via the same --live / --dry-run-actions safety gates).
  Includes opportunity scanning, position monitoring, alert rules,
  auto-compound, and the loop discoverer/executor.
author: paulomcg
license: MIT
entrypoint: ./bin/defi-strategist
runtime: python3
requires:
  - onchainos
python_packages:
  - pyyaml
tags:
  - defi
  - yield
  - monitoring
  - observability
  - okx-onchainos
links:
  source: https://github.com/paulomcg/defi-strategist
  companion_portfolio_manager: https://github.com/paulomcg/portfolio-manager
  companion_backtester: https://github.com/paulomcg/strategy-backtester
