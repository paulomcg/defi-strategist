name: defi-strategist
version: 0.3.0
description: >
  Strategy + observability layer over OnChainOS DeFi primitives.
  v0.3 ships full DYNAMIC GRAPH DISCOVERY (builds a token-edge graph
  from `defi detail` lpToken/underlyingToken — no hardcoded receipt
  map needed), RISK SCORING (APY volatility + TVL stability via
  `rate-chart` + `tvl-chart`), N-step LOOP EXECUTION with receipt-
  balance polling between steps, and ROLLBACK on partial failure
  (best-effort `defi redeem` walk-back of completed legs). Includes
  opportunity scanning, position monitoring, alert rules,
  auto-compound, and all v0.2 capabilities.
author: paulomcg
license: MIT
entrypoint: ./bin/defi-strategist
runtime: python3
requires:
  - onchainos
python_packages:
  - pyyaml
tags:
  - defi
  - yield
  - monitoring
  - observability
  - okx-onchainos
links:
  source: https://github.com/paulomcg/defi-strategist
  companion_portfolio_manager: https://github.com/paulomcg/portfolio-manager
  companion_backtester: https://github.com/paulomcg/strategy-backtester
